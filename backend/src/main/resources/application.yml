spring:
  application:
    name: deploytrack-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:deploytrack}
    username: ${DB_USER:deploytrack}
    password: ${DB_PASSWORD:deploytrack}

  flyway:
    enabled: true
    # Lets Flyway adopt a database that already has tables but no schema
    # history, by recording the current state as the baseline rather than
    # failing. Needed once, for databases created back when Hibernate owned
    # the schema; harmless on a fresh one.
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # validate, never update: Flyway owns the schema now. Hibernate only
      # checks that the entities match what the migrations produced, and
      # refuses to start if they have drifted apart. That turns a mismatch
      # into a loud failure at boot instead of a confusing runtime error.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

deploytrack:
  bootstrap:
    # Creates the first ADMIN on startup, only when no admin exists yet.
    # Intentionally blank by default so nobody ever ships a build with a
    # known default admin password -- an unconfigured app logs a warning
    # instead of silently creating a well-known account.
    admin-email: ${ADMIN_EMAIL:}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}

  log-stream:
    # How long an idle SSE connection stays open before the server closes it.
    # Browsers reconnect automatically via EventSource, so a bounded timeout
    # reclaims abandoned connections without the client noticing.
    timeout: ${LOG_STREAM_TIMEOUT:5m}

  simulator:
    # Stands in for a real CI/CD pipeline so deployments actually progress
    # to a terminal state without external tooling. Set to false once a real
    # pipeline reports outcomes via PATCH /api/deployments/{id}/status.
    enabled: ${SIMULATOR_ENABLED:true}
    step-delay: ${SIMULATOR_STEP_DELAY:1s}
    # A dashboard where nothing ever fails demonstrates nothing, so a
    # minority of simulated deployments fail.
    failure-rate: ${SIMULATOR_FAILURE_RATE:0.2}

  jwt:
    # Local-development key only. It is committed so the project runs out of
    # the box, which is exactly why it must never be reused anywhere real --
    # anyone with this value can forge a token for any user and any role.
    # Production supplies its own via the JWT_SECRET environment variable
    # (AWS Secrets Manager in Phase 10). Generate one with:
    #   openssl rand -base64 32
    secret: ${JWT_SECRET:Uaw6qGNZrDvfylhweCHyFZkQjspWnLuL9Rhs77rDiDE=}
    # Short by design. Because a JWT cannot be revoked once issued, expiry is
    # the only thing limiting the damage of a stolen token. Overridable via
    # JWT_EXPIRY (e.g. 8h) so a long demo does not mean re-logging in
    # constantly -- refresh tokens are the proper fix, deferred past MVP.
    expiry: ${JWT_EXPIRY:15m}
