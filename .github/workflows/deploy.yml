name: Deploy

# Only on pushes to main, which -- because main is protected -- means only
# after a pull request whose tests passed. Deployment is therefore never the
# first thing that runs against a change.
on:
  push:
    branches: [main]
  # Lets you redeploy the current main without pushing an empty commit, which
  # is what you want when a deployment failed for an environmental reason.
  workflow_dispatch:

# Two deploys running at once would race each other onto the same instance.
# cancel-in-progress is deliberately false: cancelling a deploy halfway leaves
# the instance in an unknown state, so the second waits instead.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  # Required for GitHub to mint the OIDC token AWS exchanges for temporary
  # credentials. Without it there is nothing to authenticate with.
  id-token: write

jobs:
  deploy:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    # Skips cleanly on a fork or before the infrastructure exists, rather than
    # failing with an authentication error that looks like a real problem.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # No access keys anywhere. The role is assumed with a short-lived
          # token that expires minutes after the job ends.
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          # The instance is ARM, so images must be built for it. Building
          # amd64 here would push images the instance cannot run, and the
          # failure appears only at deploy time as an exec format error.
          platforms: linux/arm64
          tags: |
            ${{ steps.ecr.outputs.registry }}/deploytrack-backend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/deploytrack-backend:latest
          cache-from: type=gha,scope=backend-deploy
          cache-to: type=gha,mode=max,scope=backend-deploy

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          platforms: linux/arm64
          tags: |
            ${{ steps.ecr.outputs.registry }}/deploytrack-frontend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/deploytrack-frontend:latest
          cache-from: type=gha,scope=frontend-deploy
          cache-to: type=gha,mode=max,scope=frontend-deploy

      - name: Copy compose file to the instance
        run: |
          # Sent through SSM rather than scp, so no SSH port is open and no
          # key needs to exist. Base64 avoids any quoting surprises in the
          # shell command SSM runs.
          ENCODED=$(base64 -w0 docker-compose.prod.yml)
          aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Update compose file" \
            --parameters "commands=[\"echo $ENCODED | base64 -d > /opt/deploytrack/docker-compose.prod.yml\"]" \
            --query 'Command.CommandId' --output text > /tmp/copy_id

          aws ssm wait command-executed \
            --command-id "$(cat /tmp/copy_id)" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}"

      - name: Deploy
        run: |
          # Pins the exact commit rather than :latest, so what runs is
          # identifiable and a rollback is redeploying a known tag.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy ${{ github.sha }}" \
            --parameters 'commands=[
              "set -euo pipefail",
              "cd /opt/deploytrack",
              "grep -q ^IMAGE_TAG= .env && sed -i \"s|^IMAGE_TAG=.*|IMAGE_TAG=${{ github.sha }}|\" .env || echo IMAGE_TAG=${{ github.sha }} >> .env",
              "aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}",
              "docker compose -f docker-compose.prod.yml pull",
              "docker compose -f docker-compose.prod.yml up -d",
              "docker image prune -f"
            ]' \
            --query 'Command.CommandId' --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" || true

          # The command output is the only window into what happened on the
          # instance, so it is printed whether the deploy succeeded or not.
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query 'Status' --output text)
          [ "$STATUS" = "Success" ] || exit 1

      - name: Verify the deployment is serving
        run: |
          # A deploy that starts containers but serves errors is not a
          # successful deploy. Polls until the application answers, so a
          # broken release fails the workflow rather than reporting green.
          for i in $(seq 1 20); do
            if curl -fsS --max-time 5 "http://${{ vars.AWS_APP_HOST }}/" >/dev/null; then
              echo "Application is serving."
              exit 0
            fi
            sleep 15
          done
          echo "Application did not respond within five minutes."
          exit 1
