server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Assets are content-hashed by Vite, so a given filename's contents never
    # change. Caching them for a year is safe; a new build produces new names.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or browsers keep loading an old shell
    # that references asset filenames the new deploy has already removed.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        # Single-page app: the router owns /projects/4 and /deployments/12,
        # but no such files exist on disk. Without this fallback, refreshing
        # on any route other than / returns 404 from Nginx.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-sent events break under Nginx's defaults. Buffering holds log
        # lines until the buffer fills, so a live stream arrives in silent
        # bursts or not at all; the read timeout closes an idle connection
        # mid-deployment. These four directives are what make the log stream
        # actually stream.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Connection '';
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
