openapi: 3.0.3
info:
  title: DeployTrack API
  description: Application deployment and monitoring platform.
  version: "0.1.0"
servers:
  - url: /api

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      security: []
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email or username already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me:
    get:
      tags: [Users]
      summary: Get the current authenticated user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projects]
      summary: List projects, each with its latest deployment summary
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, PAUSED]
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated project list (empty `content` array is a valid, non-error response)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProjects'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      summary: Create a project
      description: Requires role DEVELOPER or ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Project name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /projects/{projectId}:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Projects]
      summary: Get a project by id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      summary: Update a project
      description: Requires role DEVELOPER or ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      summary: Delete a project
      description: Requires role ADMIN.
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/deployments:
    parameters:
      - name: projectId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Deployments]
      summary: List deployments for a project
      parameters:
        - name: environment
          in: query
          schema: { type: string, enum: [dev, staging, production] }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DeploymentStatus' }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paginated deployment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDeployments'
    post:
      tags: [Deployments]
      summary: Trigger a deployment
      description: Requires role DEVELOPER or ADMIN. Returns immediately with status IN_PROGRESS; completion happens asynchronously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeploymentRequest'
      responses:
        '202':
          description: Deployment accepted and started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'

  /deployments/{deploymentId}:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Deployments]
      summary: Get full detail for a single deployment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /deployments/{deploymentId}/logs:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Logs]
      summary: List logs for a deployment
      parameters:
        - name: level
          in: query
          schema: { $ref: '#/components/schemas/LogLevel' }
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paginated log list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedLogs'

  /deployments/{deploymentId}/logs/stream:
    parameters:
      - name: deploymentId
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Logs]
      summary: Stream new log lines as they arrive (stretch goal, Phase 6)
      description: Server-Sent Events stream. Not required for MVP; polling `/logs` is the fallback.
      responses:
        '200':
          description: text/event-stream of LogResponse objects

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Missing, invalid, or expired token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: Authenticated, but role lacks permission for this action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: One or more fields failed validation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorResponse' }

  schemas:
    Role:
      type: string
      enum: [ADMIN, DEVELOPER, VIEWER]

    DeploymentStatus:
      type: string
      enum: [IN_PROGRESS, SUCCESS, FAILED]

    LogLevel:
      type: string
      enum: [DEBUG, INFO, WARN, ERROR]

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: seconds until expiry }
        user: { $ref: '#/components/schemas/UserResponse' }

    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        createdAt: { type: string, format: date-time }

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    ProjectResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        description: { type: string }
        status:
          type: string
          enum: [ACTIVE, PAUSED]
          description: Derived from the latest deployment, not stored directly.
        createdBy: { $ref: '#/components/schemas/UserResponse' }
        latestDeployment:
          allOf:
            - $ref: '#/components/schemas/DeploymentResponse'
          nullable: true
        createdAt: { type: string, format: date-time }

    PagedProjects:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/ProjectResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

    CreateDeploymentRequest:
      type: object
      required: [version, environment]
      properties:
        version: { type: string, example: "2.4.1" }
        environment: { type: string, enum: [dev, staging, production] }

    DeploymentResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        projectId: { type: integer, format: int64 }
        version: { type: string }
        environment: { type: string, enum: [dev, staging, production] }
        status: { $ref: '#/components/schemas/DeploymentStatus' }
        deployedBy: { $ref: '#/components/schemas/UserResponse' }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    PagedDeployments:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/DeploymentResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

    LogResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        deploymentId: { type: integer, format: int64 }
        level: { $ref: '#/components/schemas/LogLevel' }
        message: { type: string }
        timestamp: { type: string, format: date-time }

    PagedLogs:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/LogResponse' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer }

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            fieldErrors:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
